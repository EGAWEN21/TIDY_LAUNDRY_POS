<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TidyPOS Offline Mode</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            margin: 0;
            padding: 1.25rem;
            background: radial-gradient(circle at top, #dbeafe 0, #f8fafc 42%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.18);
            max-width: 400px;
            width: 90%;
        }
        img { width: 76px; height: 76px; object-fit: contain; margin-bottom: 1rem; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
        .actions { display: grid; gap: .75rem; }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
            margin: 0;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background-color: #2563eb; }
        .btn-outline {
            background-color: transparent;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        .btn-outline:hover {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/assets/images/logo-192.png" alt="">
        <h1>You're offline</h1>
        <p>This screen needs an internet connection. Reconnect to continue here, or keep taking orders in Offline POS.</p>
        <div class="actions">
            <button id="reconnect" class="btn">Reconnect</button>
            <a id="offline-pos" href="/admin/pos" class="btn btn-outline">Continue in Offline POS</a>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script>
        (function () {
            var reconnect = document.getElementById('reconnect');
            var posLink = document.getElementById('offline-pos');
            var status = document.getElementById('status');
            var canAccessPos = false;
            try { canAccessPos = localStorage.getItem('pwa-authenticated') === '1'; } catch (e) {}
            if (!canAccessPos) posLink.hidden = true;

            reconnect.addEventListener('click', async function () {
                reconnect.disabled = true;
                status.textContent = 'Checking connection…';
                var controller = new AbortController();
                var timeout = setTimeout(function () { controller.abort(); }, 6000);
                try {
                    var response = await fetch('/connectivity-check?t=' + Date.now(), {
                        cache: 'no-store', credentials: 'same-origin', signal: controller.signal
                    });
                    if (response.status === 204) {
                        status.textContent = 'Connected. Returning to your screen…';
                        window.location.reload();
                        return;
                    }
                } catch (e) {
                } finally {
                    clearTimeout(timeout);
                }
                status.textContent = 'The server still cannot be reached. Check your connection and try again.';
                reconnect.disabled = false;
            });
        })();
    </script>
</body>
</html>
