<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TidyPOS Offline Mode</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
            margin: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background-color: #2563eb; }
        .btn-outline {
            background-color: transparent;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        .btn-outline:hover {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>
    <script>
        // Intelligent Auto-Routing
        document.addEventListener('DOMContentLoaded', () => {
            // If genuinely offline, instantly redirect to the cached POS to avoid manual clicks.
            // If online (but the server is down/502), do not auto-redirect to prevent infinite loops.
            if (!navigator.onLine) {
                window.location.replace('/admin/pos');
            }
        });
    </script>
    <div class="container">
        <h1>You are Offline</h1>
        <p>The server cannot be reached. You can continue taking orders using the Offline POS.</p>
        <a href="/admin/pos" class="btn">Launch Offline POS</a>
        <button onclick="this.innerHTML = 'Reconnecting...'; this.style.opacity = '0.7'; setTimeout(() => window.location.reload(), 100);" class="btn btn-outline">Try to Reconnect</button>
    </div>
</body>
</html>
